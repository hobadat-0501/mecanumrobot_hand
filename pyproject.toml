[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mecanum-base"
version = "0.2.0rc1"
description = "Mecanum robot agent (Jetson) and app server for the web control system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
robot = [
    "pyserial>=3.5,<4",
    "websockets>=14,<17",
    "python-dotenv>=1,<2",
    "numpy>=2.0,<3",
]
server = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=14,<17",
    "python-dotenv>=1,<2",
]
camera = [
    "numpy>=2.0,<3",
    "primesense>=2.2.0.30.post5",
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["robot_agent", "app_server"]

[tool.setuptools.package-dir]
robot_agent = "robot/robot_agent"
app_server = "app/server/app_server"

[tool.pytest.ini_options]
testpaths = ["robot/tests", "app/server/tests"]
pythonpath = ["robot", "app/server"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
